# ============================================================
# UR + Robotiq 推理示例配置
# joint action: [j0..j5, gripper]
# eef action: [x,y,z,R00,R10,R20,R01,R11,R21,gripper]
# ============================================================

robot:
  type: ur
  name: ur_arm
  robot_ip: "192.168.0.10"
  dof: 6

  gripper:
    enabled: true
    name: robotiq
    port: 63352
    max_width: 0.085
    min_width: 0.0
    max_velocity: 0.2
    max_force: 100.0
    speed: 255
    force: 100

  control:
    frequency_hz: 125
    home_position_deg: [180, -90, 90, -90, -90, 0]
    home_speed: 0.5
    home_acceleration: 0.5
    joint_step_limit: 0.05
    servoj_lookahead: 0.1
    servoj_gain: 300
    wait_step_reached: false

  # joint_limits:
  #   position_min_deg: [-360, -360, -360, -360, -360, -360]
  #   position_max_deg: [360, 360, 360, 360, 360, 360]
  #   velocity_max: [3.14, 3.14, 3.14, 3.14, 3.14, 3.14]
  #   acceleration_max: [6.0, 6.0, 6.0, 6.0, 6.0, 6.0]
  #   torque_max: [150, 150, 150, 150, 150, 150]

cameras: {}

inference:
  server: "127.0.0.1:5555"
  fps: 30
  n_execute: 40

  # joint_position: 模型输出 7 维 [j0..j5, gripper]。
  # cartesian: 模型输出 10 维
  # [x,y,z,R00,R10,R20,R01,R11,R21,gripper]。
  action_space: joint_position
  policy_format: normal  # canonical 仅支持 action_space: cartesian。
  canonical_dim: 32
  arm_dim: 6
  gripper_index: 6
  gripper_mode: binary
  gripper_threshold: 0.5

  latency_compensation: true
  smooth:
    enabled: false
    overlap_steps: 8
